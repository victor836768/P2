# Ajusto l'escala abans de crear els panells.
$widget configure -wavebarheight 25
set so [$widget cget -sound]
set durada [$so length -unit seconds]
$widget configure -pixelspersecond [expr {820.0 / $durada}]

# Dibuixo la forma d'ona original.
set pane [$widget addPane -minheight 70 -maxheight 2048]
$pane configure -height 110 -scrollheight 110 -showyaxis true -yaxiswidth 60
$widget analysis::addWaveform $pane

# Mostro la potència de cada bloc de 10 ms.
set pane [$widget addPane -minheight 60 -maxheight 2048]
$pane configure -height 100 -scrollheight 100 -showyaxis true -yaxiswidth 60
$widget dataplot::addDataPlot $pane -fileextension features -stylelist {0 blue Line} -frameinterval 0.01 -offset 0.005 -unit dB -minvalue -100 -maxvalue 10

# Mostro la taxa de creuaments per zero normalitzada com a P1.
set pane [$widget addPane -minheight 60 -maxheight 2048]
$pane configure -height 100 -scrollheight 100 -showyaxis true -yaxiswidth 60
$widget dataplot::addDataPlot $pane -fileextension features -stylelist {1 green Line} -frameinterval 0.01 -offset 0.005 -unit Hz -minvalue 0 -maxvalue 8000

# Carrego l'etiquetatge de referència fixat per inspecció visual.
set pane [$widget addPane -minheight 30 -maxheight 30]
$pane configure -height 30 -scrollheight 30 -yaxiswidth 60
$widget trans::addTranscription $pane -extension lab -format WaveSurfer -labelcolor black

# Carrego la detecció automàtica per comparar-la amb la referència.
set pane [$widget addPane -minheight 30 -maxheight 30]
$pane configure -height 30 -scrollheight 30 -yaxiswidth 60
$widget trans::addTranscription $pane -extension vad -format WaveSurfer -labelcolor blue

# Afegeixo l'eix temporal.
set pane [$widget addPane -minheight 20 -maxheight 20]
$pane configure -height 20 -scrollheight 20 -yaxiswidth 60
$widget timeaxis::addTimeAxis $pane
